# Preferred Netlify site name: venturepilotai
# (or closest available: venturepilot-ai, venture-pilot-ai, etc.)

[build]
  publish = "."
  command = "echo 'Static site — no build required'"

# Internal, non-public. These paths must never be served from the public site.
# /docs/* is deliberately NOT blocked: it is pre-existing public documentation.
# Forced rules are applied before static files, so they hold even if a file is
# reintroduced into the publish directory by mistake.
[[redirects]]
  from = "/engine-hardening.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/engine-hardening/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
